<head>
<meta charset="UTF-8">

<title>Shiva-03 Building 1 Programme</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0d0b0b;color:#fff;font-family:'Sora',ui-sans-serif,system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:340px;max-width:100%;text-align:center}
.card img{width:64px;height:auto;margin:0 auto 14px}
.bn{font-weight:800;font-size:20px;letter-spacing:.02em}
.bt{font-weight:200;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:4px}
.rule{width:44px;height:3px;background:#5a1617;margin:18px auto}
.pd{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.5)}
h1{font-size:15px;font-weight:600;margin-top:6px;line-height:1.4}
.cl{font-size:10.5px;font-weight:200;color:rgba(255,255,255,.6);margin-top:5px}
form{margin-top:20px;display:flex;flex-direction:column;gap:10px;text-align:left}
label{font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45)}
input{width:100%;font-family:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.06);
 border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:11px 13px;margin-top:4px}
input:focus{outline:2px solid #8a2b2d;outline-offset:1px}
button{font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.04em;color:#fff;
 background:#5a1617;border:0;border-radius:8px;padding:12px;margin-top:8px;cursor:pointer}
button:hover{background:#75282a}
button:disabled{opacity:.55;cursor:wait}
#err{color:#ff8a75;font-size:11.5px;min-height:17px;margin-top:10px;text-align:center}
.note{font-size:9.5px;color:rgba(255,255,255,.35);margin-top:20px;line-height:1.7}
</style>
</head>

function tryWrap(kmName, idx){
  if(idx>=WRAPS.length) return Promise.reject(new Error('no-match'));
